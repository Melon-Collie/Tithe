<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Tithe — tactics board</title>
  <style>
    :root { --t0: #e8643c; --t1: #4c9be8; --soul: #ffd84a; }
    body { margin: 0; background: #111; color: #ddd;
           font: 14px system-ui, sans-serif;
           display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; }
    h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: 0.5px; }
    .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
    canvas { background: #1b1b1b; border: 1px solid #333; touch-action: none; }
    button, input, select { font: inherit; }
    button { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 6px 12px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #353535; }
    button.primary { background: var(--soul); color: #222; border-color: var(--soul); font-weight: 700; }
    .tabs { display: flex; gap: 4px; }
    .tab { background: #222; border: 1px solid #444; padding: 6px 16px; border-radius: 5px 5px 0 0; cursor: pointer; color: #aaa; }
    .tab.active { background: #333; color: #fff; border-bottom-color: #333; font-weight: 600; }
    .t0 { color: var(--t0); font-weight: 600; }
    .t1 { color: var(--t1); font-weight: 600; }
    #status { min-height: 18px; color: #9aa; }
    .boards { display: flex; gap: 16px; align-items: flex-start; }
    .board { display: flex; flex-direction: column; gap: 6px; }
    .board h2 { font-size: 14px; margin: 0; }
    .roster { font-size: 11px; }
    .roster table { border-collapse: collapse; width: 100%; }
    .roster td { padding: 1px 2px; }
    .roster th { color: #777; font-weight: normal; font-size: 10px; padding: 0 2px; }
    .roster input, .roster select { background: #222; color: #ddd; border: 1px solid #444;
                                    border-radius: 3px; font: 11px system-ui; padding: 1px; }
    .rname { width: 60px; }
    .rsel { width: 78px; }
    .rnum { width: 30px; text-align: center; }
    .hint { color: #777; font-size: 12px; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; }
    #viewer-section { display: none; flex-direction: column; align-items: center; gap: 8px; margin-top: 6px; }
    .watch { display: flex; gap: 8px; align-items: flex-start; }
    .ticker { width: 240px; height: 432px; overflow-y: auto; background: #161616;
              border: 1px solid #333; border-radius: 5px; font-size: 12px; padding: 3px; }
    .ticker .ev { padding: 2px 5px; border-radius: 3px; cursor: pointer;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ticker .ev:hover { background: #262626; }
    .ticker .ev.cur { background: #303030; outline: 1px solid #555; }
    .ticker .tk { color: #5a5a5a; margin-right: 4px; }
    .ev.goal { color: var(--soul); font-weight: 600; }
    .ev.turnover { color: var(--t0); }
    .ev.pass { color: #9a9a9a; }
    .ev.shot { color: #88a0b0; }
    .ev.soul { color: #666; text-align: center; }
    .ev.info { color: #777; }
    .ev.end { color: #fff; font-weight: 700; }
    #ptip { position: fixed; display: none; z-index: 20; pointer-events: none; white-space: nowrap;
            background: #0d0d0d; border: 1px solid #555; border-radius: 5px; padding: 6px 9px;
            font-size: 11px; line-height: 1.5; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    #ptip .tip-attrs { color: #bbb; }
  </style>
</head>
<body>
  <h1>TITHE — tactics board</h1>
  <div class="row">
    <label>seed <input id="seed" type="number" value="3" style="width: 70px" /></label>
    <button id="run" class="primary">▶ Run match</button>
    <button id="reset">Reset</button>
    <span id="status"></span>
  </div>
  <div class="tabs">
    <div class="tab active" id="tab-attack">In possession</div>
    <div class="tab" id="tab-defend">Out of possession</div>
  </div>
  <p class="hint">Editing the <b id="phase-name">attacking</b> shape. Drag any player to reposition. Each team attacks toward its own goal (the ring in its colour).</p>
  <div class="boards">
    <div class="board">
      <h2 class="t0" id="name0">Embers</h2>
      <canvas id="ed0" width="452" height="300"></canvas>
      <div class="roster" id="roster0"></div>
    </div>
    <div class="board">
      <h2 class="t1" id="name1">Wardens</h2>
      <canvas id="ed1" width="452" height="300"></canvas>
      <div class="roster" id="roster1"></div>
    </div>
  </div>

  <div id="viewer-section">
    <div class="row">
      <button id="play">⏸ Pause</button>
      <label>speed <input id="speed" type="range" min="1" max="16" value="4" /></label>
      <span id="score"></span>
      <span id="tick"></span>
      <span id="winner" style="font-weight:700"></span>
    </div>
    <input id="scrub" type="range" min="0" value="0" style="width: 968px" />
    <div class="watch">
      <canvas id="viewer" width="720" height="432"></canvas>
      <div id="ticker" class="ticker"></div>
    </div>
  </div>

  <div id="ptip"></div>

  <script>
  // ---- arena (SimConfig defaults; the editor needs them before a run) --------
  const ARENA = { half_x: 50, half_y: 30, goal_x: 45 };
  const FLASH_TICKS = 18; // how long an event ring lingers (ticks)
  const teamColor = t => (t === 0 ? '#e8643c' : '#4c9be8');
  const roleAbbr = r => ({ runner:'RUN', outlet:'OUT', pivot:'PIV', playmaker:'PLY', finisher:'FIN',
                           sweeper:'SWP', marker:'MRK', destroyer:'DES', hawk:'HWK', cheat:'CHT' }[r] || r);

  // A field<->screen mapping for a canvas (shared by the boards and the viewer).
  function field(canvas) {
    const m = 26;
    const scale = Math.min((canvas.width - 2*m) / (ARENA.half_x*2), (canvas.height - 2*m) / (ARENA.half_y*2));
    return {
      scale,
      sx: x => canvas.width/2 + x*scale,
      sy: y => canvas.height/2 - y*scale,
      fx: px => (px - canvas.width/2) / scale,
      fy: py => (canvas.height/2 - py) / scale,
    };
  }

  function drawArena(ctx, canvas, f) {
    ctx.fillStyle = '#1b1b1b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(canvas.width/2, canvas.height/2, ARENA.half_x*f.scale, ARENA.half_y*f.scale, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(canvas.width/2, f.sy(ARENA.half_y)); ctx.lineTo(canvas.width/2, f.sy(-ARENA.half_y)); ctx.stroke();
    for (const [gx, team] of [[-ARENA.goal_x, 0], [ARENA.goal_x, 1]]) {
      ctx.strokeStyle = teamColor(team); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.sx(gx), f.sy(0), 10, 0, Math.PI*2); ctx.stroke();
    }
  }

  // Axial-hex helpers (must match the sim: pointy-top, √3 truncated to 1.7320).
  const SQRT3 = 1.7320;
  function hexCenter(q, r) { const s = (META && META.board ? META.board.hex_size : 4); return { x: s*SQRT3*(q + r/2), y: s*1.5*r }; }
  const mirrorHex = (q, r) => [-q - r, r]; // reflect a hex across x=0 (its own inverse)

  // The in-bounds board hex nearest a field point — players snap onto it. Returns
  // {q, r, x, y}. Falls back to a computed hex if the board hasn't loaded yet.
  function nearestHex(x, y) {
    if (!META || !META.board) return { q: 0, r: 0, x: Math.round(x), y: Math.round(y) };
    let best = META.board.hexes[0], bd = Infinity;
    for (const h of META.board.hexes) {
      const dx = h.x - x, dy = h.y - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = h; }
    }
    return { q: best.q, r: best.r, x: best.x, y: best.y };
  }

  // Trace a single pointy-top hexagon (a vertex points up) into the current path.
  function hexPath(ctx, f, cx, cy, s) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i - 30);
      const X = f.sx(cx + s * Math.cos(a)), Y = f.sy(cy + s * Math.sin(a));
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.closePath();
  }

  // The hex board (§14): faint pointy-top hex outlines at each in-bounds center.
  function drawHexes(ctx, f, board) {
    if (!board) return;
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    for (const h of board.hexes) { hexPath(ctx, f, h.x, h.y, board.hex_size); ctx.stroke(); }
  }

  // A role's footprint as filled board hexes: every in-bounds cell inside the
  // ellipse (half_x × half_y, leaned `lean` toward the enemy goal) around the
  // anchor. Low alpha so overlapping zones read as a team coverage map (the
  // brighter a hex, the more players cover it).
  function drawFootprint(ctx, f, board, cx, cy, hx, hy, fill) {
    if (!board) return;
    ctx.fillStyle = fill;
    for (const h of board.hexes) {
      const nx = (h.x - cx) / hx, ny = (h.y - cy) / hy;
      if (nx * nx + ny * ny > 1) continue;
      hexPath(ctx, f, h.x, h.y, board.hex_size); ctx.fill();
    }
  }

  // ---- editor state ----------------------------------------------------------
  // editTeams[t] = { name, players:[{ name, attackRole, defendRole, ...attrs,
  //                                   attack:{q,r,x,y}, defend:{q,r,x,y} }] }
  // Anchors are board hexes: {q,r} is the cell, {x,y} its field center (what's
  // drawn). Stored in absolute (display) coords; team 1 mirrors to/from the
  // team-0 frame on load/export, since the sim mirrors team 1 across x.
  let editTeams = [];
  let phase = 'attack'; // which shape the tabs are editing
  let META = null;      // board + per-role footprint shapes (for drawing zones)
  let hoverEd = { team: -1, pi: -1 }; // the editor player under the cursor (highlight its zone)

  const boards = [
    { team: 0, canvas: document.getElementById('ed0') },
    { team: 1, canvas: document.getElementById('ed1') },
  ];
  boards.forEach(b => { b.ctx = b.canvas.getContext('2d'); b.f = field(b.canvas); });

  // The "call the sim" seam: in-page WASM if present (the static/desktop build),
  // else the dev server's /api. Same UI either way — only this glue differs.
  let SIM = null;
  async function initSim() {
    try {
      const mod = await import('./pkg/tithe_wasm.js');
      await mod.default(); // wasm-bindgen init (fetches + instantiates the .wasm)
      SIM = {
        mode: 'wasm',
        meta: () => JSON.parse(mod.meta()),
        setup: () => JSON.parse(mod.default_setup()),
        run: (b) => JSON.parse(mod.run_match(JSON.stringify(b.setup), BigInt(b.seed), BigInt(b.max_ticks))),
      };
    } catch (_) {
      SIM = {
        mode: 'server',
        meta: async () => (await fetch('/api/meta')).json(),
        setup: async () => (await fetch('/api/default-setup')).json(),
        run: async (b) => {
          const r = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
          if (!r.ok) throw new Error(await r.text());
          return r.json();
        },
      };
    }
  }

  async function loadDefault() {
    const setup = await SIM.setup();
    editTeams = setup.teams.map((team, t) => {
      const A = setup.formations[team.attack_formation].slots;
      const D = setup.formations[team.defend_formation].slots;
      // Slots are team-0-frame hexes [q,r]; team 1 mirrors across x. Resolve each
      // to an absolute {q,r,x,y} the editor draws and drags.
      const toAbs = qr => {
        const [q, r] = t === 0 ? [qr[0], qr[1]] : mirrorHex(qr[0], qr[1]);
        const c = hexCenter(q, r);
        return { q, r, x: c.x, y: c.y };
      };
      document.getElementById('name' + t).textContent = team.name;
      return {
        name: team.name,
        players: team.players.map((p, i) => ({
          name: p.name, attackRole: p.attack_role, defendRole: p.defend_role,
          acc: p.accuracy, rng: p.range, hand: p.handling, strip: p.stripping, cont: p.contesting, pass: p.passing, pos: p.positioning, pace: p.pace, awr: p.awareness, end: p.endurance,
          attack: toAbs(A[i]), defend: toAbs(D[i]),
        })),
      };
    });
    drawAll();
    buildRosters();
  }

  function drawBoard(b) {
    drawArena(b.ctx, b.canvas, b.f);
    drawHexes(b.ctx, b.f, META && META.board);
    // Footprints first (under the dots): the team's coverage map for this phase.
    if (META) {
      const table = phase === 'attack' ? META.attack : META.defend;
      const fwd = b.team === 0 ? 1 : -1; // enemy goal is +x for team 0, -x for team 1
      editTeams[b.team].players.forEach((p, i) => {
        const fp = table[phase === 'attack' ? p.attackRole : p.defendRole];
        if (!fp) return;
        const [hx, hy, lean] = fp;
        const hot = hoverEd.team === b.team && hoverEd.pi === i;
        const alpha = hot ? 0.22 : 0.05;
        const c = b.team === 0 ? `232,100,60` : `76,155,232`;
        drawFootprint(b.ctx, b.f, META.board, p[phase].x + lean * fwd, p[phase].y, hx, hy, `rgba(${c},${alpha})`);
      });
    }
    editTeams[b.team].players.forEach((p, i) => {
      const pos = p[phase];
      const px = b.f.sx(pos.x), py = b.f.sy(pos.y);
      b.ctx.fillStyle = teamColor(b.team);
      b.ctx.beginPath(); b.ctx.arc(px, py, 8, 0, Math.PI*2); b.ctx.fill();
      b.ctx.fillStyle = '#fff'; b.ctx.font = 'bold 9px system-ui';
      b.ctx.textAlign = 'center'; b.ctx.textBaseline = 'middle';
      b.ctx.fillText(i + 1, px, py + 0.5);
      b.ctx.textBaseline = 'alphabetic';
      b.ctx.fillStyle = '#eee'; b.ctx.font = '10px system-ui';
      b.ctx.fillText(p.name, px, py - 11);
      b.ctx.fillStyle = '#888'; b.ctx.font = '8px system-ui';
      b.ctx.fillText(roleAbbr(phase === 'attack' ? p.attackRole : p.defendRole), px, py + 16);
    });
  }
  function drawAll() { boards.forEach(drawBoard); }

  // ---- editable roster -------------------------------------------------------
  const ATTACK_ROLES = [['runner','Runner'],['outlet','Outlet'],['pivot','Pivot'],
                        ['playmaker','Playmaker'],['finisher','Finisher']];
  const DEFEND_ROLES = [['sweeper','Sweeper'],['marker','Marker'],['destroyer','Destroyer'],
                        ['hawk','Hawk'],['cheat','Cheat']];
  const ATTRS = [['acc','A'],['rng','R'],['hand','H'],['strip','S'],['cont','C'],['pass','P'],['pos','Po'],['pace','Pc'],['awr','Aw'],['end','En']];

  function selectHtml(field, options, current, t, i) {
    const opts = options.map(([v, label]) =>
      `<option value="${v}"${v === current ? ' selected' : ''}>${label}</option>`).join('');
    return `<select class="rsel" data-t="${t}" data-i="${i}" data-f="${field}">${opts}</select>`;
  }

  // Build the editable roster tables once; edits mutate the model in place (no
  // re-render, so inputs keep focus) and redraw the board labels.
  function buildRosters() {
    editTeams.forEach((team, t) => {
      const head = `<tr><th>#</th><th>name</th><th>att</th><th>def</th>` +
        ATTRS.map(([, l]) => `<th>${l}</th>`).join('') + `</tr>`;
      const rows = team.players.map((p, i) => {
        const num = `<span class="dot" style="background:${teamColor(t)}"></span> ${i + 1}`;
        const name = `<input class="rname" type="text" value="${p.name}" data-t="${t}" data-i="${i}" data-f="name">`;
        const att = selectHtml('attackRole', ATTACK_ROLES, p.attackRole, t, i);
        const def = selectHtml('defendRole', DEFEND_ROLES, p.defendRole, t, i);
        const nums = ATTRS.map(([f]) =>
          `<td><input class="rnum" type="number" min="0" max="100" value="${p[f]}" data-t="${t}" data-i="${i}" data-f="${f}"></td>`).join('');
        return `<tr><td class="hint">${num}</td><td>${name}</td><td>${att}</td><td>${def}</td>${nums}</tr>`;
      }).join('');
      document.getElementById('roster' + t).innerHTML = `<table>${head}${rows}</table>`;
    });
  }

  // Delegated handler: a roster edit updates the player model + the board label.
  function onRosterEdit(e) {
    const el = e.target;
    const { t, i, f } = el.dataset;
    if (t === undefined || f === undefined) return;
    const p = editTeams[+t].players[+i];
    if (el.classList.contains('rnum')) {
      p[f] = Math.max(0, Math.min(100, parseInt(el.value, 10) || 0));
    } else {
      p[f] = el.value;
    }
    drawBoard(boards[+t]);
  }
  ['roster0', 'roster1'].forEach(id => {
    const c = document.getElementById(id);
    c.addEventListener('input', onRosterEdit);
    c.addEventListener('change', onRosterEdit);
  });

  // ---- tabs ------------------------------------------------------------------
  function setPhase(p) {
    phase = p;
    document.getElementById('tab-attack').classList.toggle('active', p === 'attack');
    document.getElementById('tab-defend').classList.toggle('active', p === 'defend');
    document.getElementById('phase-name').textContent = p === 'attack' ? 'attacking' : 'defending';
    drawAll();
  }
  document.getElementById('tab-attack').onclick = () => setPhase('attack');
  document.getElementById('tab-defend').onclick = () => setPhase('defend');

  // ---- dragging (per board) --------------------------------------------------
  let drag = null; // { board, pi }
  // Map a pointer event to canvas-internal pixels. Scale by width/rect.width so
  // it stays correct when CSS displays the canvas at a different size than its
  // intrinsic resolution (browser zoom, OS display scaling, a flex-squished row).
  function mousePos(canvas, e) {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left) * (canvas.width / r.width),
            (e.clientY - r.top) * (canvas.height / r.height)];
  }
  boards.forEach(b => {
    b.canvas.addEventListener('pointerdown', e => {
      const [mx, my] = mousePos(b.canvas, e);
      const ps = editTeams[b.team].players;
      for (let pi = 0; pi < ps.length; pi++) {
        const pos = ps[pi][phase];
        const dx = b.f.sx(pos.x) - mx, dy = b.f.sy(pos.y) - my;
        if (dx*dx + dy*dy <= 12*12) { drag = { board: b, pi }; b.canvas.setPointerCapture(e.pointerId); break; }
      }
    });
    b.canvas.addEventListener('pointermove', e => {
      const [mx, my] = mousePos(b.canvas, e);
      if (drag && drag.board === b) {
        const pos = editTeams[b.team].players[drag.pi][phase];
        const h = nearestHex(b.f.fx(mx), b.f.fy(my)); // snap the anchor onto a hex
        pos.x = h.x; pos.y = h.y;
        drawBoard(b);
        return;
      }
      // Not dragging: highlight the zone of the player under the cursor.
      const ps = editTeams[b.team].players;
      let pi = -1;
      for (let k = 0; k < ps.length; k++) {
        const dx = b.f.sx(ps[k][phase].x) - mx, dy = b.f.sy(ps[k][phase].y) - my;
        if (dx*dx + dy*dy <= 13*13) { pi = k; break; }
      }
      if (hoverEd.team !== b.team || hoverEd.pi !== pi) { hoverEd = { team: b.team, pi }; drawBoard(b); }
    });
    b.canvas.addEventListener('pointerleave', () => {
      if (hoverEd.team === b.team && hoverEd.pi !== -1) { hoverEd = { team: -1, pi: -1 }; drawBoard(b); }
    });
    b.canvas.addEventListener('pointerup', () => { drag = null; });
  });

  // ---- run -------------------------------------------------------------------
  function buildSetup() {
    const formations = {};
    const teams = editTeams.map((team, t) => {
      const an = `t${t}_attack`, dn = `t${t}_defend`;
      // Slots are team-0-frame hexes; team 1 is mirrored by the sim, so store its
      // anchors mirrored back to that frame (mirrorHex is its own inverse).
      const back = cell => (t === 0 ? [cell.q, cell.r] : mirrorHex(cell.q, cell.r));
      formations[an] = { slots: team.players.map(p => back(p.attack)) };
      formations[dn] = { slots: team.players.map(p => back(p.defend)) };
      return {
        name: team.name,
        attack_formation: an,
        defend_formation: dn,
        players: team.players.map(p => ({
          name: p.name, attack_role: p.attackRole, defend_role: p.defendRole,
          accuracy: p.acc, range: p.rng, handling: p.hand, stripping: p.strip, contesting: p.cont, passing: p.pass, positioning: p.pos, pace: p.pace, awareness: p.awr, endurance: p.end,
        })),
      };
    });
    return { formations, teams };
  }

  const statusEl = document.getElementById('status');
  document.getElementById('run').onclick = async () => {
    statusEl.textContent = 'running…';
    const body = { setup: buildSetup(), seed: Number(document.getElementById('seed').value), max_ticks: 200000 };
    let match;
    try {
      match = await SIM.run(body);
    } catch (err) { statusEl.textContent = 'error: ' + err; return; }
    statusEl.textContent = `${match.frames.length} ticks · final ${match.frames.at(-1)?.score.join('–') ?? '0–0'}` +
      (match.winner != null ? ` · winner ${editTeams[match.winner].name}` : ' · (hit tick cap)');
    startViewer(match);
  };
  document.getElementById('reset').onclick = loadDefault;

  // ---- viewer (playback) -----------------------------------------------------
  const vSection = document.getElementById('viewer-section');
  const vc = document.getElementById('viewer');
  const vctx = vc.getContext('2d');
  const vF = field(vc);
  const speedEl = document.getElementById('speed');
  const scrub = document.getElementById('scrub');
  const playBtn = document.getElementById('play');
  const tickerEl = document.getElementById('ticker');
  let MATCH = null, idx = 0, playing = false, acc = 0, last = 0;
  let tickerRows = [], curEv = -1;

  function startViewer(match) {
    MATCH = match;
    vSection.style.display = 'flex';
    scrub.max = match.frames.length - 1;
    idx = 0; setPlaying(true); last = performance.now();
    buildTicker(match);
    vSection.scrollIntoView({ behavior: 'smooth' });
  }
  function setPlaying(p) { playing = p; playBtn.textContent = playing ? '⏸ Pause' : '▶ Play'; }

  // ---- play-by-play ticker ---------------------------------------------------
  function buildTicker(match) {
    tickerEl.innerHTML = '';
    curEv = -1;
    tickerRows = match.events.map(e => {
      const el = document.createElement('div');
      el.className = 'ev ' + e.kind;
      el.innerHTML = `<span class="tk">${e.tick}</span>${e.text}`;
      el.onclick = () => jumpToTick(e.tick);
      tickerEl.appendChild(el);
      return { tick: e.tick, el };
    });
  }
  function jumpToTick(tick) {
    const frames = MATCH.frames;
    let f = frames.length - 1;
    for (let k = 0; k < frames.length; k++) { if (frames[k].tick >= tick) { f = k; break; } }
    idx = f; setPlaying(false);
  }
  // Highlight + scroll to the latest event at or before the current frame.
  function syncTicker() {
    if (!MATCH || !tickerRows.length) return;
    const tick = MATCH.frames[idx].tick;
    let cur = -1;
    for (let k = 0; k < tickerRows.length; k++) { if (tickerRows[k].tick <= tick) cur = k; else break; }
    if (cur === curEv) return;
    if (curEv >= 0) tickerRows[curEv].el.classList.remove('cur');
    if (cur >= 0) { tickerRows[cur].el.classList.add('cur'); tickerRows[cur].el.scrollIntoView({ block: 'nearest' }); }
    curEv = cur;
  }

  function drawViewer(fr) {
    drawArena(vctx, vc, vF);
    drawHexes(vctx, vF, MATCH.board);
    const meta = MATCH.agents, frames = MATCH.frames;
    // Soul trail: a fading tail of recent positions.
    vctx.strokeStyle = 'rgba(255,216,74,0.35)'; vctx.lineWidth = 2; vctx.beginPath();
    for (let k = Math.max(0, idx - 18); k <= idx; k++) {
      const s = frames[k].soul; const X = vF.sx(s[0]), Y = vF.sy(s[1]);
      if (k === Math.max(0, idx - 18)) vctx.moveTo(X, Y); else vctx.lineTo(X, Y);
    }
    vctx.stroke();
    for (let i = 0; i < fr.agents.length; i++) {
      const a = fr.agents[i], m = meta[i];
      const X = vF.sx(a.x), Y = vF.sy(a.y);
      vctx.globalAlpha = a.stagger ? 0.3 : 0.5 + 0.5 * (a.stamina ?? 1);
      vctx.fillStyle = teamColor(m.team);
      vctx.beginPath(); vctx.arc(X, Y, 9, 0, Math.PI*2); vctx.fill();
      if (fr.carrier === m.id) {
        vctx.globalAlpha = 1; vctx.strokeStyle = '#ffd84a'; vctx.lineWidth = 2.5;
        vctx.beginPath(); vctx.arc(X, Y, 12, 0, Math.PI*2); vctx.stroke();
      }
      // Jersey number in the dot — identify a player at a glance.
      vctx.globalAlpha = 1; vctx.fillStyle = '#fff'; vctx.font = 'bold 10px system-ui';
      vctx.textAlign = 'center'; vctx.textBaseline = 'middle';
      vctx.fillText(m.number, X, Y + 0.5);
    }
    vctx.textBaseline = 'alphabetic';
    vctx.globalAlpha = 1;
    vctx.fillStyle = '#ffd84a'; vctx.shadowColor = '#ffb000'; vctx.shadowBlur = 12;
    vctx.beginPath(); vctx.arc(vF.sx(fr.soul[0]), vF.sy(fr.soul[1]), 5, 0, Math.PI*2); vctx.fill();
    vctx.shadowBlur = 0;
    // Event flashes: an expanding ring at a recent goal / turnover / missed shot.
    const FLASH_COLOR = { goal: '#ffd84a', turnover: '#e8643c', shot: '#88a0b0' };
    for (const e of MATCH.events) {
      const color = FLASH_COLOR[e.kind];
      if (!color) continue;
      const age = fr.tick - e.tick;
      if (age < 0 || age > FLASH_TICKS) continue;
      const u = age / FLASH_TICKS;
      // A miss is less dramatic than a turnover/goal — dimmer, smaller.
      const peak = e.kind === 'shot' ? 0.45 : 0.75;
      const grow = e.kind === 'shot' ? 14 : 22;
      vctx.globalAlpha = (1 - u) * peak;
      vctx.strokeStyle = color;
      vctx.lineWidth = e.kind === 'shot' ? 2 : 3;
      vctx.beginPath(); vctx.arc(vF.sx(e.pos[0]), vF.sy(e.pos[1]), 6 + grow * u, 0, Math.PI*2); vctx.stroke();
    }
    vctx.globalAlpha = 1;
    if (fr.scored !== undefined) {
      vctx.fillStyle = teamColor(fr.scored); vctx.globalAlpha = 0.15;
      vctx.fillRect(0, 0, vc.width, vc.height); vctx.globalAlpha = 1;
    }
    document.getElementById('score').innerHTML =
      `<span class="t0">${fr.score[0]}</span> – <span class="t1">${fr.score[1]}</span>`;
    document.getElementById('tick').textContent = `tick ${fr.tick}`;
    const w = document.getElementById('winner');
    w.innerHTML = (idx === frames.length - 1 && MATCH.winner != null)
      ? `WINNER: <span class="t${MATCH.winner}">${editTeams[MATCH.winner].name}</span>` : '';
    scrub.value = idx;
  }

  function loop(now) {
    if (MATCH) {
      const dt = now - last; last = now;
      if (playing) {
        acc += (dt / 1000) * 60 * (Number(speedEl.value) / 4);
        while (acc >= 1) {
          idx = Math.min(idx + 1, MATCH.frames.length - 1); acc -= 1;
          if (idx >= MATCH.frames.length - 1) setPlaying(false);
        }
      }
      drawViewer(MATCH.frames[idx]);
      syncTicker();
    }
    requestAnimationFrame(loop);
  }
  playBtn.onclick = () => { if (idx >= MATCH.frames.length - 1) idx = 0; setPlaying(!playing); };
  scrub.oninput = () => { idx = Number(scrub.value); setPlaying(false); };

  // ---- hover a player → roles + attributes -----------------------------------
  const ptip = document.getElementById('ptip');
  const ROLE_LABEL = { runner:'Runner', outlet:'Outlet', pivot:'Pivot', playmaker:'Playmaker', finisher:'Finisher',
                       sweeper:'Sweeper', marker:'Marker', destroyer:'Destroyer', hawk:'Hawk', cheat:'Cheat' };
  function tipHtml(m) {
    const a = m.attrs;
    const lbl = r => ROLE_LABEL[r] || r;
    return `<div class="t${m.team}" style="font-weight:600">#${m.number} ${m.name}</div>` +
      `<div class="hint">${lbl(m.attack_role)} / ${lbl(m.defend_role)}</div>` +
      `<div class="tip-attrs">Acc ${a.acc}&ensp;Rng ${a.rng}&ensp;Han ${a.han}</div>` +
      `<div class="tip-attrs">Str ${a.str}&ensp;Con ${a.con}&ensp;Pas ${a.pas}</div>` +
      `<div class="tip-attrs">Pos ${a.pos}&ensp;Pace ${a.pace}&ensp;Awr ${a.awr}&ensp;End ${a.end}</div>`;
  }
  vc.addEventListener('mousemove', e => {
    if (!MATCH) { ptip.style.display = 'none'; return; }
    const r = vc.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (vc.width / r.width), my = (e.clientY - r.top) * (vc.height / r.height);
    const fr = MATCH.frames[idx];
    let hit = -1, best = 13 * 13;
    for (let i = 0; i < fr.agents.length; i++) {
      const dx = vF.sx(fr.agents[i].x) - mx, dy = vF.sy(fr.agents[i].y) - my;
      const d2 = dx * dx + dy * dy;
      if (d2 < best) { best = d2; hit = i; }
    }
    if (hit >= 0) {
      ptip.innerHTML = tipHtml(MATCH.agents[hit]);
      ptip.style.display = 'block';
      ptip.style.left = (e.clientX + 14) + 'px';
      ptip.style.top = (e.clientY + 12) + 'px';
    } else { ptip.style.display = 'none'; }
  });
  vc.addEventListener('mouseleave', () => { ptip.style.display = 'none'; });

  // Pick the sim backend (WASM or dev server), then load the draw data + setup.
  (async () => {
    await initSim();
    try { META = await SIM.meta(); } catch (_) { META = null; }
    await loadDefault();
  })();
  requestAnimationFrame(loop);
  </script>
</body>
</html>
