[package]
name = "tithe-wasm"
description = "WASM bindings for Tithe: run the sim in the browser with no server. The in-browser front-end target — same shared export as tithe-web, but the sim runs in-process in the page."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lib]
# cdylib for the wasm artifact; rlib so it still builds/tests on the host target.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
tithe-sim = { path = "../tithe-sim" }
tithe-replay = { path = "../tithe-replay" }
serde_json = "1"
wasm-bindgen = "0.2"
