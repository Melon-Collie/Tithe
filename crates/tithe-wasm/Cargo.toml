[package]
name = "tithe-wasm"
description = "WASM bindings for Tithe: run the sim in the browser with no server. The in-browser front-end target — same shared export as tithe-web, but the sim runs in-process in the page."
# `version`/`repository` are literals (not `.workspace = true`) because wasm-pack
# parses this manifest itself for the generated package.json and doesn't resolve
# workspace inheritance for those npm-metadata fields — older wasm-pack builds
# error with "invalid type: map, expected a string". Kept in sync with the
# workspace by hand (both are trivial/stable).
version = "0.0.0"
edition.workspace = true
repository = "https://github.com/Melon-Collie/Tithe"
publish = false

[lib]
# cdylib for the wasm artifact; rlib so it still builds/tests on the host target.
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
tithe-sim = { path = "../tithe-sim" }
tithe-replay = { path = "../tithe-replay" }
serde_json = "1"
wasm-bindgen = "0.2"
