[package]
name = "tithe-sim"
description = "Headless, deterministic simulation core for Tithe. Zero rendering dependencies."
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Deterministic fixed-point arithmetic (Q16.16 via I16F16). Integer-only, so
# it is bit-stable across native and WASM — the foundation of the determinism
# contract. Chosen over hand-rolled math: battle-tested, minimal deps (typenum),
# WASM-ready, and easier to audit. (CLAUDE.md → Determinism rules / Stack.)
fixed = "1"
# Derive-only: lets the sim's *input boundary* types (MatchSetup, roles, rosters)
# be (de)serialized by a consumer (§9 "serialized inputs go in"). No floats and
# no nondeterminism are introduced — the setup format carries integers, never Fx.
serde = { version = "1", features = ["derive"] }
