name: Deploy web demo

# Build the WASM web demo and publish it to GitHub Pages on every push to main.
# Same UI as the dev server, but the sim runs in the page as WASM — no backend.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on the same fmt + clippy + test every push runs.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (with the wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build the WASM into the web UI
        run: wasm-pack build crates/tithe-wasm --target web --out-dir ../tithe-web/web/pkg --release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the static site (index.html + pkg/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/tithe-web/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
